[workspace]
members = ["crates/hooviestar-engine", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.9"
edition = "2024"
authors = ["OpenHoo"]
description = "Native GPU scene compositor for clean Discord screen sharing"
homepage = "https://github.com/openhoo/hooviestar"
repository = "https://github.com/openhoo/hooviestar"
license = "MIT"
rust-version = "1.96"

[workspace.dependencies]
anyhow = "1.0"
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.17", features = ["v4", "serde"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
